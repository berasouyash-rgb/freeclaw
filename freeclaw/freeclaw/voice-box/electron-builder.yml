# Voice Flow — electron-builder config (Windows + macOS desktop apps).
# Built in CI (.github/workflows/native.yml), never committed as a binary.
# Per-user install (no admin rights needed on school devices).
appId: app.voicebox
productName: Voice Flow
directories:
  output: electron/dist
# Every file the shell needs at runtime must be listed — the entry point
# (electron/main.cjs) included. Omitting it produces an app.asar with no
# main script and electron-builder fails the build with "Application entry
# file ... does not exist".
files:
  - dist/**
  - "!dist/**/*.map"
  - electron/main.cjs
  - electron/preload.cjs
  - electron/icon.png
  - electron/icon.icns
  - package.json
  - "!node_modules/**"
  # The shell's main/preload require only `electron` (provided by the
  # runtime) plus node built-ins; the renderer ships fully bundled in
  # dist/. Packing node_modules added ~110MB of dead weight (including
  # Gradle cache pollution inside @capacitor plugin android/ trees).
extraMetadata:
  main: electron/main.cjs
win:
  # Without this electron-builder falls back to the stock Electron icon and
  # the installed app (shortcut, taskbar, Add/Remove Programs) shows generic
  # branding instead of Voice Flow's.
  icon: electron/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: Voice-Box-Desktop-${version}-win-x64.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Voice Flow
mac:
  # Unsigned (no Apple Developer cert in CI): users right-click → Open on
  # first launch. icon.icns is generated by scripts/make-icons.mjs on macOS
  # runners (sips + iconutil); other platforms skip it with a warning.
  icon: electron/icon.icns
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: Voice-Box-Desktop-${version}-mac-${arch}.${ext}
dmg:
  window:
    width: 540
    height: 380
