<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Voice Flow — Anonymous School Feedback Platform</title>
    <meta name="description" content="Voice Flow lets students share anonymous feedback, report issues, and track solutions. Voice matters — speak up and watch real change happen at your school." />
    <meta name="theme-color" content="#0B0B0E" />
    <link rel="canonical" href="https://voice-box-psi.vercel.app/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://voice-box-psi.vercel.app/" />
    <meta property="og:title" content="Voice Flow — Anonymous School Feedback Platform" />
    <meta property="og:description" content="Empowering student voices through anonymous feedback, polls, and verified school actions." />
    <meta property="og:image" content="https://voice-box-psi.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Voice Flow — Anonymous School Feedback Platform" />
    <meta name="twitter:description" content="Empowering student voices through anonymous feedback, polls, and verified school actions." />
    <meta name="twitter:image" content="https://voice-box-psi.vercel.app/og-image.png" />

    <!-- Security & Performance Meta Tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts: Albert Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Clean, Professional Loading Screen (Zero AI Slop) -->
    <style>
      :root {
        --spl-bg: #0b0b0e;
        --vb-card: #14141a;
        --spl-fg: #f4f2ec;
        --spl-muted: #8c8c95;
        --vb-border: rgba(244, 242, 236, 0.08);
        --spl-accent: #6366f1;
        --spl-accent-glow: rgba(99, 102, 241, 0.25);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --spl-bg: #f8f8fb;
          --vb-card: #ffffff;
          --spl-fg: #14141a;
          --spl-muted: #6d6d78;
          --vb-border: rgba(20, 20, 26, 0.08);
          --spl-accent: #5652d6;
          --spl-accent-glow: rgba(86, 82, 214, 0.2);
        }
      }
      [data-theme="dark"] {
        --spl-bg: #0b0b0e;
        --vb-card: #14141a;
        --spl-fg: #f4f2ec;
        --spl-muted: #8c8c95;
        --vb-border: rgba(244, 242, 236, 0.08);
        --spl-accent: #6366f1;
        --spl-accent-glow: rgba(99, 102, 241, 0.25);
      }
      [data-theme="light"] {
        --spl-bg: #f8f8fb;
        --vb-card: #ffffff;
        --spl-fg: #14141a;
        --spl-muted: #6d6d78;
        --vb-border: rgba(20, 20, 26, 0.08);
        --spl-accent: #5652d6;
        --spl-accent-glow: rgba(86, 82, 214, 0.2);
      }

      #vb-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--spl-bg);
        color: var(--spl-fg);
        font-family: "Albert Sans", system-ui, -apple-system, sans-serif;
        overflow: hidden;
        user-select: none;
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #vb-splash.vb-hide,
      #vb-splash.vb-morph-out {
        opacity: 0;
        transform: scale(0.99);
        pointer-events: none;
        visibility: hidden;
      }

      .vb-splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 320px;
        padding: 24px;
      }

      .vb-splash-logo {
        position: relative;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
        box-shadow: 0 8px 24px var(--spl-accent-glow);
        display: grid;
        place-items: center;
        margin-bottom: 20px;
      }

      .vb-splash-logo svg {
        width: 28px;
        height: 28px;
        color: #ffffff;
      }

      .vb-splash-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: -0.025em;
        margin: 0 0 6px 0;
        color: var(--spl-fg);
      }

      .vb-splash-desc {
        font-size: 13px;
        color: var(--spl-muted);
        margin: 0 0 24px 0;
        font-weight: 400;
      }

      .vb-progress-track {
        width: 180px;
        height: 3px;
        border-radius: 9999px;
        background: var(--vb-border);
        overflow: hidden;
        position: relative;
        margin-bottom: 14px;
      }

      .vb-progress-fill {
        display: block;
        height: 100%;
        width: 100%;
        background: var(--spl-accent);
        border-radius: 9999px;
        transform: scaleX(var(--vb-progress, 0.15));
        transform-origin: left;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .vb-status-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        color: var(--spl-muted);
      }

      .vb-status-index {
        color: var(--spl-accent);
        font-weight: 600;
      }

      @media (prefers-reduced-motion: reduce) {
        #vb-splash {
          transition: opacity 0.15s ease;
        }
        .vb-progress-fill {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="vb-splash" role="status" aria-label="Loading Voice Flow">
      <div class="vb-splash-container">
        <div class="vb-splash-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" x2="12" y1="19" y2="22" />
          </svg>
        </div>
        <h1 class="vb-splash-title">Voice Flow</h1>
        <p class="vb-splash-desc">Anonymous Student Platform</p>
        <div class="vb-progress-track" aria-hidden="true">
          <span class="vb-progress-fill" id="vb-progress-bar"></span>
        </div>
        <div class="vb-status-meta">
          <span class="vb-status-index" id="vb-stage-index">01</span>
          <span id="vb-stage-label">Loading...</span>
        </div>
      </div>

      <script>
        (function () {
          try {
            var saved = localStorage.getItem("vb_theme") || localStorage.getItem("theme");
            var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            if (saved === "dark" || (prefersDark && saved !== "light")) document.documentElement.setAttribute("data-theme", "dark");
            else if (saved === "light") document.documentElement.setAttribute("data-theme", "light");
          } catch (e) {}

          window.addEventListener("vb:boot-stage", function (event) {
            var detail = event.detail || {};
            var label = document.getElementById("vb-stage-label");
            var index = document.getElementById("vb-stage-index");
            var bar = document.getElementById("vb-progress-bar");
            if (label && typeof detail.label === "string") label.textContent = detail.label;
            if (index && typeof detail.index === "number") index.textContent = String(detail.index).padStart(2, "0");
            if (bar && typeof detail.index === "number") bar.style.setProperty("--vb-progress", String(Math.min(1, Math.max(0.15, detail.index / 3))));
          });
        })();
      </script>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
