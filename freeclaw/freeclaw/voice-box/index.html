<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Voice Box — Anonymous School Feedback Platform</title>
    <meta name="description" content="Voice Box lets students share anonymous feedback, report issues, and track solutions. Voice matters — speak up and watch real change happen at your school." />
    <meta name="theme-color" content="#5652d6" />

    <!-- Fonts: preconnect + preload for zero FOIT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Splash screen — shown instantly before React mounts -->
    <style>
      #vb-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f6f6f9; color: #171724;
        font-family: 'Albert Sans', system-ui, sans-serif;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      #vb-splash.vb-hide { opacity: 0; transform: scale(0.98); pointer-events: none; }
      #vb-splash .mark { width: 48px; height: 48px; margin-bottom: 16px; }
      #vb-splash .wordmark { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
      #vb-splash .tagline { font-size: 13px; color: #8e8ea5; margin-top: 6px; }
      #vb-splash .spinner { margin-top: 24px; width: 20px; height: 20px; border: 2.5px solid #e4e4ee; border-top-color: #5652d6; border-radius: 50%; animation: spin 0.7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .dark #vb-splash { background: #0e0e16; color: #f0f0f7; }
      .dark #vb-splash .tagline { color: #6e6e88; }
      .dark #vb-splash .spinner { border-color: #262637; border-top-color: #8b85f5; }
    </style>
  </head>
  <body>
    <!-- Splash screen DOM — removed by main.tsx once React mounts -->
    <div id="vb-splash">
      <svg class="mark" viewBox="0 0 48 48" fill="none">
        <rect width="48" height="48" rx="12" fill="#5652d6"/>
        <path d="M16 18h16v4H16zM16 24h12v4H16zM16 30h14v4H16z" fill="#fff" opacity="0.9"/>
      </svg>
      <div class="wordmark">Voice Box</div>
      <div class="tagline">Your Voice Matters</div>
      <div class="spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
