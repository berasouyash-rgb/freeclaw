version: "3.8"

services:
  # ── Redis (event bus + caching) ──────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data

  # ── Python Workforce Runtime ─────────────────────────────────
  workforce:
    build:
      context: ./services
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Node.js API (existing) ──────────────────────────────────
  # Uncomment if running locally with docker-compose
  # api:
  #   build:
  #     context: .
  #     dockerfile: api/Dockerfile
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - SUPABASE_URL=${SUPABASE_URL}
  #     - SUPABASE_KEY=${SUPABASE_KEY}
  #     - NVIDIA_API_KEY=${NVIDIA_API_KEY}
  #     - REDIS_URL=redis://redis:6379
  #   depends_on:
  #     redis:
  #       condition: service_healthy

volumes:
  redis_data:
