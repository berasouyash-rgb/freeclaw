name: CI — Test, Typecheck & Lint

# Runs on EVERY push (any branch) and every pull request, so no change can
# land without the full gate: eslint + tsc + frontend suite + API suite +
# production build. API tests are fully mocked (DB + fetch) — a failure
# there is a real regression and blocks the pipeline like every other check.
on:
  push:
  pull_request:
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # The voice-box app lives at this path inside the repo (git root is
        # the parent workspace, tracked as freeclaw/freeclaw/voice-box).
        working-directory: freeclaw/freeclaw/voice-box
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: freeclaw/freeclaw/voice-box/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npx tsc -b --noEmit

      - name: Frontend tests (jsdom)
        run: npx vitest run --no-file-parallelism

      - name: Production build
        run: npm run build

      - name: API tests (node)
        run: npx vitest run --no-file-parallelism --config vitest.config.api.ts
